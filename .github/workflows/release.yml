name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-14

    steps:
      - name: Check out source and LevelDB submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run unit tests
        run: ./build.sh --test

      - name: Build distribution artifacts
        env:
          CODE_SIGNING_ALLOWED: NO
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/package_app.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/artifacts/* \
            --title "DeepSeekBalance $GITHUB_REF_NAME" \
            --generate-notes
